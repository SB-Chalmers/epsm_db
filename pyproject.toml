[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
license = "MIT"
license-files = ["LICENSE"]
name = "epsm_db"
version = "0.5.0"
description = "GIS-first PostGIS data lake for linked Swedish building evidence"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=23,<26",
  "geopandas>=1,<2",
  "pyogrio>=0.11,<1",
  "pyproj>=3.5,<4",
  "shapely>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "flask>=3.1,<4"]
onboarding = ["flask>=3.1,<4", "gunicorn>=23,<24"]
notebook = ["matplotlib>=3.9,<4", "nbclient>=0.10,<1", "ipykernel>=6,<8", "jupyterlab>=4,<5"]
catalogue = ["epsm_data>=0.7.0,<0.8"]
epsm = ["epsm>=0.5.0,<0.6", "epsm_core>=0.9.0,<0.10", "epsm_data>=0.7.0,<0.8"]
weather = ["smhi2epw>=1.3.0,<2"]

[project.scripts]
epsm-db = "epsm_db.lake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["epsm_db*"]

[tool.setuptools.package-data]
epsm_db = ["municipality_names.json"]

[tool.setuptools.data-files]
"share/epsm_db/config" = ["config/gis-lake.toml", "config/gis-context.toml", "config/gis-statistics.example.toml", "config/scb-open-data.toml"]
"share/epsm_db/sql/lake" = ["sql/lake/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgis: requires EPSM_LAKE_TEST_URL, a disposable validation database"]

[tool.ruff]
line-length = 100
