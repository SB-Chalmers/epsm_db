services:
  postgis:
    image: postgis/postgis:17-3.5@sha256:8dfee83d8bd4c2873dc4a233c13ba2799a44f2edb16a0552d58715917fac32ba
    platform: linux/amd64
    environment:
      POSTGRES_DB: sweden_ubem
      POSTGRES_USER: ubem_owner
      POSTGRES_PASSWORD: ${UBEM_POSTGRES_PASSWORD:-ubem-local-only}
    ports:
      - "127.0.0.1:${UBEM_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ubem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubem_owner -d sweden_ubem"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ubem_pgdata:
