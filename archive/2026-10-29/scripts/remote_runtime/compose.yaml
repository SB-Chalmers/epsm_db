services:
  postgis:
    image: postgis/postgis:17-3.5@sha256:8dfee83d8bd4c2873dc4a233c13ba2799a44f2edb16a0552d58715917fac32ba
    platform: linux/amd64
    container_name: ubem-national-postgis
    restart: unless-stopped
    mem_limit: 16g
    shm_size: 2g
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ubem_owner
      POSTGRES_PASSWORD: ${UBEM_POSTGRES_PASSWORD:?private runtime environment required}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - __UBEM_ROOT__/database/pg17:/var/lib/postgresql/data
    command: [postgres, -c, shared_buffers=4GB, -c, work_mem=16MB, -c, maintenance_work_mem=512MB, -c, max_wal_size=8GB]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ubem_owner -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
