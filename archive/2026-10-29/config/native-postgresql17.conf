# Dedicated local development cluster; do not reuse an existing service directory.
listen_addresses = '127.0.0.1'
port = 55433
shared_buffers = '2GB'
work_mem = '16MB'
maintenance_work_mem = '512MB'
autovacuum_work_mem = '128MB'
max_wal_size = '4GB'
fsync = on
synchronous_commit = on
full_page_writes = on
