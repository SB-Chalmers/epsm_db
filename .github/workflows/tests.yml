name: Evidence database tests
on: [push, pull_request, workflow_dispatch]

jobs:
  synthetic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        dependencies: ['pinned', 'dev']
    services:
      postgis:
        image: postgis/postgis:17-3.5@sha256:8dfee83d8bd4c2873dc4a233c13ba2799a44f2edb16a0552d58715917fac32ba
        env:
          POSTGRES_USER: ubem_owner
          POSTGRES_PASSWORD: ubem-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ubem_owner -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_data
          ssh-key: ${{ secrets.EPSM_DATA_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.dependencies == 'dev' && 'dev' || '6d7b24dcde23353a684f58c875309f129bb9ad06' }}
          path: .ci/epsm_data
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_core
          ssh-key: ${{ secrets.EPSM_CORE_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.dependencies == 'dev' && 'dev' || 'ba00ae1230e3ef8db4c4e8041624b69485bfd5c8' }}
          path: .ci/epsm_core
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_lca
          ssh-key: ${{ secrets.EPSM_LCA_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.dependencies == 'dev' && 'dev' || '00141d0500e717b4f18a9d69e158f0af2aae1934' }}
          path: .ci/epsm_lca
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_rc
          ssh-key: ${{ secrets.EPSM_RC_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.dependencies == 'dev' && 'dev' || 'd8f42ab69e61cfe580f234b20ddc47cf6d056e59' }}
          path: .ci/epsm_rc
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm
          ssh-key: ${{ secrets.EPSM_REPO_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.dependencies == 'dev' && 'dev' || '2c6a3cfc55697c90905a103b6ec00fa087907d98' }}
          path: .ci/epsm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build .ci/epsm_data .ci/epsm_core .ci/epsm_lca .ci/epsm_rc .ci/epsm '.[test,notebook,epsm,catalogue]'
      - name: Require installed public collaborators
        run: |
          python -c 'import epsm, epsm_core, epsm_data, epsm_lca, epsm_rc, epsm_db; from pathlib import Path; assert all("site-packages" in Path(m.__file__).parts for m in (epsm, epsm_core, epsm_data, epsm_lca, epsm_rc, epsm_db))'
      - name: Test fresh schema, loaders, notebook and backup/restore
        env:
          UBEM_TEST_ADMIN_URL: postgresql://ubem_owner:ubem-test-only@127.0.0.1:5432/postgres
          UBEM_TEST_BACKUP_CONTAINER: ${{ job.services.postgis.id }}
        run: python -m pytest -q
      - name: Build and check installed wheel
        run: |
          python -m build --wheel
          python -m pip install --no-deps --force-reinstall dist/epsm_db-*.whl
          python -m pip check
          cd /tmp
          python -c 'from epsm_db import BuildingRecord, Stock; print(BuildingRecord, Stock)'
          python - <<'PY'
          from epsm_data import Catalogue
          catalogue = Catalogue.load()
          assert catalogue.dataset_id
          assert catalogue.era_for_year(2022) == "SE.07"
          assert "SE.07" in catalogue.dimensions["eras"]
          slots = catalogue.search(category="multi_family", era="SE.07")
          assert slots and all(slot.key.renovation_state is None for slot in slots)
          assert catalogue.get_slot(slots[0].key).slot_id == slots[0].slot_id
          assert isinstance(catalogue.summary(), dict)
          configuration = catalogue.effective_configuration()
          configuration["installed_smoke_detached"] = True
          assert "installed_smoke_detached" not in catalogue.effective_configuration()
          print("Installed catalogue inspection passed:", catalogue.dataset_id)
          PY
