name: Development checks
'on':
  pull_request:
    branches:
    - dev
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
    - name: Install development prerequisites
      run: python -m pip install build '.[test]'
    - name: Run offline development checks
      run: |
        python -m pytest -q tests/test_gis_stock_api.py tests/test_portable_records.py tests/test_lm_xml.py tests/test_operation_logging.py tests/test_documentation.py tests/test_packaged_resources.py tests/test_manage_db_access.py
        python -m build --wheel
